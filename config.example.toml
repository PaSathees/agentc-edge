# Copy to config.toml. Only [site] and [plugs] are needed to start; the rest is optional.
# `agentc find` (docs/setup.md) prints your plugs' lines. Secrets go in .env, never here.

[site]
name = "home"
tz = "Asia/Colombo"  # your time zone, as in https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

[plugs]  # a name you choose = the plug's address on your home network
"Plug-1" = "192.0.2.11"
"Plug-2" = "192.0.2.12"

# ---------------------------------------------------------------------------------------
# Optional. Without these, costs are in kWh only, with no money or carbon.

# The grid's average kgCO2e per kWh (location-based Scope 2), with its source.
[carbon]
id = "slsea-2023"
factor = 0.4242
source = "SLSEA Sri Lanka Energy Balance 2023, Table 9.1, average emission factor"
valid_from = "2023-01-01"

# Model calls (decision ADR-005). Optional: these are the defaults, so leave them out
# unless you change one. The API key goes in .env (ANTHROPIC_API_KEY), never here.
# [llm]
# month_usd = 3.0  # stop all model calls for the rest of the month at this spend
# run_usd = 0.05  # stop one agent run at this spend
# plan_usd = 0.25  # stop one weekly Planner run at this spend
#
# [llm.tiers.small]  # the housemate (and chat, Phase 5)
# model = "claude-haiku-5-5"
# usd_in = 0.10  # USD per million tokens, from the price page
# usd_out = 0.50
# effort = "low"
#
# [llm.tiers.mid]  # the Planner (Phase 5)
# model = "claude-sonnet-5-5"
# usd_in = 2.0
# usd_out = 10.0
# effort = "medium"

# What is plugged into each plug. Optional: a plug not listed keeps its own name,
# access "advice" and timer slots 9 to 16. The name is the only one a model sees.
# access: "none" = never changed; "advice" = proposals only; "write" = written after approval.
# What each device is (its card: kind, room, what is plugged in, why its timers are set)
# lives in app.db, not here: `agentc house` shows it, `agentc house Plug-1 kind=computer`
# sets it. This file holds only what the agent may never change: names, access, rules.
[devices."Plug-1"]
name = "Desk 2"
rules = [
    { kind = "latest_off", time = "01:00", hard = false, text = "Desk 2 may run until 01:00" },
]

[devices."Plug-2"]
name = "3D printer"
access = "none"  # it also powers the printer's controller

# Thresholds (decisions about the home). Optional: `agentc policy` lists them all, with
# why. Change one for the whole site here, or for one device under its own name, e.g.
# [devices."Plug-8".policy] with night_wake_w = 0 to be woken for a heater at any size.
# [policy]
# questions_a_day = 3

# Example rates only. Copy yours from your bill or the regulator's published schedule.
# kind = "block": the month's total picks a schedule (no up_to = no limit), then band by band.
[tariff]
kind = "block"
month_kwh = 150  # your whole house's units in 30 days, from your bill: it picks the block
source = "Example tariff, not real rates"
levy = 0.025  # tax on the whole bill (Sri Lanka's SSCL is 2.5%); leave out if none

[[tariff.schedules]]
up_to = 60
bands = [
    { up_to = 30, rate = 10.0, fixed = 100.0 },
    { up_to = 60, rate = 20.0, fixed = 200.0 },
]

[[tariff.schedules]]
bands = [
    { up_to = 60, rate = 30.0 },
    { up_to = 90, rate = 40.0, fixed = 400.0 },
    { rate = 50.0, fixed = 500.0 },
]

# Or time-of-use: replace the [tariff] section above with
# [tariff]
# kind = "time_of_use"
# source = "..."
# fixed = 500.0
# periods = [
#     { start = "05:30", rate = 30.0 },
#     { start = "18:30", rate = 60.0 },
#     { start = "22:30", rate = 20.0 },
# ]
