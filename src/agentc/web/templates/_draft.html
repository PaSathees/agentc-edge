<section class="card draft">
  <b>Card for {{ name }}</b>
  {% with card = draft %}{% include "_card.html" %}{% endwith %}
  <form hx-post="/setup/{{ plug }}/save" hx-target="closest section" hx-swap="outerHTML">
    <input type="hidden" name="tok" value="{{ tok }}">
    <button class="primary">Save card</button>
  </form>
  <span class="muted">Or say what to change.</span>
</section>
